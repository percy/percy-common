agents: &agents
  os: 'linux_small'

command: &command
  - make test

steps:
  - label: ':rubocop: Lint'
    agents: *agents
    command:
      - make lint

  - label: ':rspec: Test Ruby 3.0'
    env:
      BASE_IMAGE: 'ruby:3.0-alpine@sha256:a59120aca45394ee979248e886672acaac91f175daf52cb91deb43075b076bd1'
    agents: *agents
    command: *command

  - label: ':rspec: Test Ruby 3.3'
    env:
      BASE_IMAGE: 'ruby:3.3-alpine@sha256:24ea89e8103548bc02b53ae5212313afaccc79d11c5f93982bd4de298ec0934d'
    agents: *agents
    command: *command

  - label: ':rspec: Test Ruby 3.4'
    env:
      BASE_IMAGE: 'ruby:3.4-alpine@sha256:730b265fc537e93f4ad335031ba95f8a9df88dc75bd9462968b92f368a115f6d'
    agents: *agents
    command: *command
